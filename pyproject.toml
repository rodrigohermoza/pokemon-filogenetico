[project]
name = "pokemon-filogenetico"
version = "0.1.0"
description = "Árbol filogenético de Pokémon a partir de movimientos, habilidades y tipos (PokéAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "scipy>=1.18",
    "biopython>=1.88",
    "dendropy>=5.1",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
